name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create FirebaseConfig.swift
        run: |
          cat > SecureVaultDemo/Config/FirebaseConfig.swift <<EOF
          enum FirebaseConfig {
              static let apiKey = "${{ secrets.FIREBASE_API_KEY }}"
              static let baseURLAccounts = "https://identitytoolkit.googleapis.com/v1/accounts"
          }
          EOF

      - name: Build
        run: |
          xcodebuild build \
            -project SecureVaultDemo.xcodeproj \
            -scheme SecureVaultDemo \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
